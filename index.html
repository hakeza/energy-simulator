<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b08" />
  <title>Energy Simulator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">E</div><div><div class="eyebrow">ENERGY</div><div class="brand-name">SIMULATOR</div></div></div>
      <div class="balance"><span>⚡</span><strong id="balance">0</strong></div>
    </header>
    <main id="app" class="content"></main>
    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span>Главная</span></button>
      <button class="nav-btn" data-page="games"><span class="nav-icon">◈</span><span>Игры</span></button>
      <button class="nav-btn" data-page="tasks"><span class="nav-icon">✓</span><span>Задания</span></button>
      <button class="nav-btn" data-page="profile"><span class="nav-icon">♙</span><span>Профиль</span></button>
    </nav>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
